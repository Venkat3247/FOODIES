        <!-- RIGHT SIDE - LOGIN FORM -->

                    <div id="loginError"
                         style="display:none; color:#ff4d4f;

                    <!-- EMAIL -->

                            <span class="input-icon">✉️</span>

                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required>

                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">Password</label>

                        <div class="input-icon-wrapper">

                            <span class="input-icon">🔒</span>

                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required>

                        </div>

                    </div>

                    <!-- OPTIONS -->
                    <div class="form-options">

                        <label class="remember-me">

                            <input type="checkbox" name="rememberMe">

                            <span>Remember me</span>

                        </label>

                        <a href="forgotPassword.jsp" class="forgot-password">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="btn-primary login-btn">
                        Log In
                    </button>

                    <!-- GOOGLE LOGIN CONFIGURATION -->
                    <div id="g_id_onload"
                        data-client_id="936389627472-9qnv2b0i1e84orbr3c61uf083ht3cp4s.apps.googleusercontent.com"
                        data-callback="handleGoogleSignIn"
                        data-ux_mode="popup">
                    </div>

                    <!-- GOOGLE BUTTON -->

                        <div id="googleButton"></div>

                    </div>

                </form>

                <!-- FOOTER -->
                <div class="login-footer">

                    <p>
                        Don't have an account?
                        <a href="signup.html">Sign up</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- THEME AND IMAGE SLIDER -->
    <script>

        const root = document.documentElement;

        if (localStorage.getItem('theme') === 'light') {
            root.setAttribute('data-theme', 'light');
        }

        document.addEventListener('DOMContentLoaded', function () {

            const slides = document.querySelectorAll('.slider-bg');

            let currentSlide = 0;

            function nextSlide() {

                slides[currentSlide].classList.remove('active');

                currentSlide = (currentSlide + 1) % slides.length;

                slides[currentSlide].classList.add('active');

            }

            if (slides.length > 1) {
                setInterval(nextSlide, 4000);
            }

            // SHOW LOGIN ERROR MESSAGE
            const params = new URLSearchParams(window.location.search);

            if (params.get("error") === "invalid") {

                const errorBox = document.getElementById("loginError");

                if (errorBox) {
                    errorBox.style.display = "block";
                }

            }

        });

    </script>

    <!-- GOOGLE SIGN-IN BUTTON -->
    <script>

        window.addEventListener("load", function () {

            const loginButton = document.querySelector(".login-btn");

            const googleButton = document.getElementById("googleButton");

            function renderGoogleButton() {

                if (!window.google || !google.accounts || !loginButton) {

                    setTimeout(renderGoogleButton, 200);

                    return;
                }

                google.accounts.id.initialize({

                    client_id: "936389627472-9qnv2b0i1e84orbr3c61uf083ht3cp4s.apps.googleusercontent.com",

                    callback: handleGoogleSignIn,

                    ux_mode: "popup"

                });

                google.accounts.id.renderButton(

                    googleButton,

                    {
                        type: "standard",
                        theme: "outline",
                        size: "large",
                        text: "continue_with",
                        shape: "rectangular",
                        width: Math.min(loginButton.offsetWidth, 400)
                    }

                );

            }

            renderGoogleButton();

        });

        function handleGoogleSignIn(response) {

            const formData = new URLSearchParams();

            formData.append("credential", response.credential);

            fetch("googleLogin", {

                method: "POST",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body: formData.toString()

            })

            .then(res => {

                if (!res.ok) {
                    throw new Error("Server error: " + res.status);
                }

                return res.json();

            })

            .then(data => {

                if (data.success) {

                    window.location.href = "Checkout.jsp";

                } else {

                    alert(data.message || "Google login failed. Please register first.");

                }

            })

            .catch(error => {

                console.error(error);

                alert("Google login failed. Please try again.");

            });

        }

    </script>
